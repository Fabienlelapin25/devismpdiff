<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MP Diffusion - Générateur de Devis A4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #e5e7eb;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* PANNEAU GAUCHE */
    .left-panel {
        width: 25%;
        background: #ffffff;
        padding: 20px;
        border-right: 2px solid #d1d5db;
        overflow-y: auto;
    }
    .left-panel h2 {
        margin-top: 0;
        color: #0d3b66;
    }
    .left-panel label {
        font-weight: bold;
        margin-top: 10px;
        display: block;
    }
    .left-panel input, .left-panel textarea, .left-panel select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #d1d5db;
        border-radius: 5px;
    }

    /* PREVIEW */
    .preview-container {
        width: 50%;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        justify-content: center;
    }

    /* PAGE A4 */
    .page {
        width: 210mm;
        min-height: 297mm;
        background: white;
        padding: 20mm;
        margin-bottom: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        position: relative;
        box-sizing: border-box;
    }

    @page {
        size: A4;
        margin: 0;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .header img {
        height: 80px;
    }

    .title {
        text-align: center;
        margin-top: 20px;
        font-size: 28px;
        color: #0d3b66;
        font-weight: bold;
    }

    /* SECTIONS */
    .section {
        margin-top: 25px;
    }
    .section h3 {
        margin-bottom: 5px;
        color: #0d3b66;
    }

    /* TABLEAU */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 14px;
    }
    table, th, td {
        border: 1px solid #d1d5db;
    }
    th, td {
        padding: 10px;
        text-align: left;
    }

    /* TOTALS */
    .totaux {
        margin-top: 20px;
        text-align: right;
        font-size: 18px;
    }

    /* PANNEAU DROIT */
    .right-panel {
        width: 25%;
        background: #ffffff;
        padding: 20px;
        border-left: 2px solid #d1d5db;
        overflow-y: auto;
    }
    .right-panel button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: #0d3b66;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
    }
    .right-panel button:hover {
        background: #0b3257;
    }

</style>
</head>

<body>

<!-- PANEL GAUCHE -->
<div class="left-panel">
    <h2>Informations du devis</h2>

    <label>Nom du client</label>
    <input id="client" type="text">

    <label>Service</label>
    <textarea id="service"></textarea>

    <label>Quantité</label>
    <input id="quantite" type="number" value="1">

    <label>Prix unitaire (€)</label>
    <input id="prix" type="number" value="0">

    <label>TVA (20%)</label>
    <select id="tva">
        <option value="oui">Oui</option>
        <option value="non">Non</option>
    </select>

    <label>Date</label>
    <input id="date" type="date">
</div>

<!-- PREVIEW -->
<div class="preview-container">
    <div id="preview">
        <div class="page">

            <div class="header">
                <img src="assets/logo.png" alt="Logo MP Diffusion">
                <div>
                    <strong>MP Diffusion</strong><br>
                    Solutions & Services Professionnels
                </div>
            </div>

            <div class="title">DEVIS</div>

            <div class="section">
                <h3>Client</h3>
                <div id="p_client">Nom du client</div>
            </div>

            <div class="section">
                <h3>Détails</h3>
                <table>
                    <tr>
                        <th>Service</th>
                        <th>Quantité</th>
                        <th>Prix Unitaire</th>
                        <th>Total</th>
                    </tr>
                    <tr>
                        <td id="p_service"></td>
                        <td id="p_quantite"></td>
                        <td id="p_prix"></td>
                        <td id="p_total"></td>
                    </tr>
                </table>
            </div>

            <div class="totaux">
                <div id="p_ht"></div>
                <div id="p_tva"></div>
                <div id="p_ttc"></div>
            </div>

            <div class="section">
                <h3>Date</h3>
                <div id="p_date"></div>
            </div>

        </div>
    </div>
</div>

<!-- PANEL DROIT -->
<div class="right-panel">
    <button id="reset">Réinitialiser</button>
    <button id="exportPNG">Exporter en PNG</button>
</div>

<script>
function updatePreview() {
    const client = document.getElementById("client").value;
    const service = document.getElementById("service").value;
    const quantite = Number(document.getElementById("quantite").value);
    const prix = Number(document.getElementById("prix").value);
    const tvaActive = document.getElementById("tva").value === "oui";
    const date = document.getElementById("date").value;

    const totalHT = quantite * prix;
    const montantTVA = tvaActive ? totalHT * 0.20 : 0;
    const totalTTC = totalHT + montantTVA;

    document.getElementById("p_client").innerText = client || "Nom du client";
    document.getElementById("p_service").innerText = service;
    document.getElementById("p_quantite").innerText = quantite;
    document.getElementById("p_prix").innerText = prix + " €";
    document.getElementById("p_total").innerText = totalHT + " €";

    document.getElementById("p_ht").innerText = "Total HT : " + totalHT + " €";
    document.getElementById("p_tva").innerText = "TVA (20%) : " + montantTVA + " €";
    document.getElementById("p_ttc").innerText = "Total TTC : " + totalTTC + " €";

    document.getElementById("p_date").innerText = date;
}

document.querySelectorAll("input, textarea, select").forEach(el => {
    el.addEventListener("input", updatePreview);
});

document.getElementById("reset").onclick = () => {
    document.querySelectorAll("input, textarea").forEach(el => el.value = "");
    document.getElementById("quantite").value = 1;
    document.getElementById("prix").value = 0;
    updatePreview();
};

document.getElementById("exportPNG").onclick = () => {
    html2canvas(document.querySelector(".page")).then(canvas => {
        const link = document.createElement("a");
        link.download = "devis.png";
        link.href = canvas.toDataURL();
        link.click();
    });
};

updatePreview();
</script>

</body>
</html>
